{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Login | User Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="User Management System" name="description" />
    <meta content="Themesbrand" name="author" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://kit-pro.fontawesome.com/releases/v5.13.1/css/pro.min.css" media="screen" />
    
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'enroll/assets/images/favicon.ico' %}">

    <!-- Bootstrap Css -->
    <link href="{% static 'enroll/assets/css/bootstrap.min.css' %}" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'enroll/assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="{% static 'enroll/assets/css/app.min.css' %}" id="app-style" rel="stylesheet" type="text/css" />
    <link href="{% static 'enroll/assets/css/app.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="home-btn d-none d-sm-block">
        <a href="{% url 'enroll:dashboard' %}" class="text-dark"><i class="fas fa-home h2"></i></a>
    </div>
    <div class="account-pages my-5 pt-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card overflow-hidden">
                        <div class="bg-login text-center">
                            <div class="bg-login-overlay"></div>
                            <div class="position-relative">
                                <h5 class="text-white font-size-20">Welcome Back!</h5>
                                <p class="text-white-50 mb-0">Sign in to continue to Dashboard.</p>
                                <a href="{% url 'enroll:dashboard' %}" class="logo logo-admin mt-4">
                                    <img src="{% static 'enroll/assets/images/logo-sm-dark.png' %}" alt="" height="30">
                                </a>
                            </div>
                        </div>
                        <div class="card-body pt-5">
                            <div class="p-2">
                                {% if messages %}
                                <div class="messages">
                                    {% for message in messages %}
                                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                                        {{ message }}
                                    </div>
                                    {% endfor %}
                                </div>
                                {% endif %}
                                
                                <form class="form-horizontal" method="POST" action="{% url 'enroll:user_login' %}">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <label for="username">Username</label>
                                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="password">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                                    </div>

                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input" id="customControlInline">
                                        <label class="custom-control-label" for="customControlInline">Remember me</label>
                                    </div>

                                    <div class="mt-3">
                                        <button class="btn btn-primary btn-block waves-effect waves-light" type="submit">Log In</button>
                                    </div>

                                    <div class="mt-4 text-center">
                                        <a href="{% url 'enroll:forgot_password' %}" class="text-muted"><i class="mdi mdi-lock mr-1"></i> Forgot your password?</a>
                                    </div>
                                    
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <p>Don't have an account? <a href="{% url 'enroll:signup' %}" class="font-weight-medium text-primary">Sign up now</a></p>
                        <p> 2025 User Management. Crafted with <i class="mdi mdi-heart text-danger"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="{% static 'enroll/assets/libs/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'enroll/assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'enroll/assets/libs/metismenu/metisMenu.min.js' %}"></script>
    <script src="{% static 'enroll/assets/libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'enroll/assets/libs/node-waves/waves.min.js' %}"></script>

    <!-- App js -->
    <script src="{% static 'enroll/assets/js/app.js' %}"></script>
</body>
</html>
