{% extends "enroll/base.html" %}

{% load static %}

{% block title %}
<title>Change Password | User Management</title>
{% endblock %}

{% block content %}

<!-- ============================================================== -->
<!-- Start right Content here -->
<!-- ============================================================== -->
<div class="main-content">

    <div class="page-content">

        <!-- start page title -->
        <div class="row">
            <div class="col-12">
                <div class="page-title-box d-flex align-items-center justify-content-between">
                    <h4 class="page-title mb-0 font-size-18">Change Password</h4>



                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 col-xl-12">
                <div class="card">
                    <div class="card-body">
                        <div class="profile-section">
                            <div class="profile-header">

                                <body data-layout="detached" data-topbar="colored">
                                    <div class="container-fluid">
                                        <div class="row">
                                            <div class="col-12">
                                                <div
                                                    class="page-title-box d-flex align-items-center justify-content-between">
                                                    <h4 class="mb-0 font-size-18"></h4>
                                                    <div class="page-title-right">
                                                        <a href="{% url 'enroll:profile' %}"
                                                            class="btn btn-secondary waves-effect waves-light">
                                                            <i class="fas fa-arrow-left mr-2"></i> Back to
                                                            Profile
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-xl-6 mx-auto">
                                                <div class="card">
                                                    <div class="card-body">
                                                        {% if messages %}
                                                        {% for message in messages %}
                                                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                                                            role="alert">
                                                            {{ message }}
                                                            <button type="button" class="close" data-dismiss="alert"
                                                                aria-label="Close">
                                                                <span aria-hidden="true">&times;</span>
                                                            </button>
                                                        </div>
                                                        {% endfor %}
                                                        {% endif %}

                                                        <form method="POST" class="needs-validation" novalidate>
                                                            {% csrf_token %}
                                                            <div class="form-group">
                                                                <div class="form-group">
                                                                    <label for="current_password"
                                                                        style="color: #000000;">Current
                                                                        Password</label>
                                                                    <div class="input-group">
                                                                        <input type="password" class="form-control"
                                                                            id="current_password"
                                                                            name="current_password" required>
                                                                        <div class="input-group-append">
                                                                            <button class="btn btn-light" type="button"
                                                                                onclick="togglePassword('current_password')">
                                                                                <i class="fa fa-eye"></i>
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div class="form-group">
                                                                    <label for="new_password"
                                                                        style="color: #000000;">New
                                                                        Password</label>
                                                                    <div class="input-group">
                                                                        <input type="password" class="form-control"
                                                                            id="new_password" name="new_password"
                                                                            required>
                                                                        <div class="input-group-append">
                                                                            <button class="btn btn-light" type="button"
                                                                                onclick="togglePassword('new_password')">
                                                                                <i class="fa fa-eye"></i>
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div class="form-group">
                                                                    <label for="confirm_password"
                                                                        style="color: #000000;">Confirm New
                                                                        Password</label>
                                                                    <div class="input-group">
                                                                        <input type="password" class="form-control"
                                                                            id="confirm_password"
                                                                            name="confirm_password" required>
                                                                        <div class="input-group-append">
                                                                            <button class="btn btn-light" type="button"
                                                                                onclick="togglePassword('confirm_password')">
                                                                                <i class="fa fa-eye"></i>
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div class="mt-4">
                                                                    <button
                                                                        class="btn btn-primary waves-effect waves-light"
                                                                        type="submit">Change Password</button>
                                                                </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- JAVASCRIPT -->

                                    <script>
                                        function togglePassword(fieldId) {
                                            var field = document.getElementById(fieldId);
                                            if (field.type === "password") {
                                                field.type = "text";
                                            } else {
                                                field.type = "password";
                                            }
                                        }

                                        // Form validation
                                        (function () {
                                            'use strict';
                                            window.addEventListener('load', function () {
                                                var forms = document.getElementsByClassName('needs-validation');
                                                var validation = Array.prototype.filter.call(forms, function (form) {
                                                    form.addEventListener('submit', function (event) {
                                                        if (form.checkValidity() === false) {
                                                            event.preventDefault();
                                                            event.stopPropagation();
                                                        }
                                                        form.classList.add('was-validated');
                                                    }, false);
                                                });
                                            }, false);
                                        })();
                                    </script>
                                </body>

                                </html>
                                {% endblock %}
