{% extends 'enroll/base.html' %}
{% load static %}

{% block content %}
<div class="main-content">
    <div class="page-content">
        <div class="row">
            <div class="col-12">
                <div class="page-title-box d-flex align-items-center justify-content-between">
                    <h4 class="page-title mb-0 font-size-18">ADD TAG</h4>
                </div>
            </div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card mb-4">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="tag_name" style="color: #000000; font-weight: 600;">Tag Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="tag_name" name="tag_name" required placeholder="Enter tag name">
                        <div class="invalid-feedback">
                            Please enter Tag Name.
                        </div>
                    </div>

                    

                    <button type="submit" class="btn btn-primary mt-4">Add Tag</button>
                    <a href="{% url 'enroll:tags' %}" class="btn btn-secondary mt-4">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
