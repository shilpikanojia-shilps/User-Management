{% extends "enroll/base.html" %}
{% load static %}

{% block title %}
<title>Edit Banner | User Management</title>
{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-content">
        <div class="row">
            <div class="col-12">
                <div class="page-title-box d-flex align-items-center justify-content-between">
                    <h4 class="page-title mb-0 font-size-18">EDIT BANNER</h4>
                </div>
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="title" style="color: #000000; font-weight: 600;">Banner Title <span
                        class="text-danger">*</span></label>
                <input type="text" class="form-control" id="title" name="title" value="{{ banner.title }}" required>
                <div class="invalid-feedback">Please enter Banner Title.</div>
            </div>

            <div class="form-group mt-3">
                <label style="color: #000000; font-weight: 600;">Upload Images</label>
                <div class="custom-file">
                    <input type="file" class="form-control" id="newImages" name="images" multiple accept="image/*"
                        onchange="previewImages(event)">
                </div>
            </div>
            <!-- <div id="newImagePreviewContainer" class="mt-3 d-flex flex-wrap"></div> -->

            <div id="imagePreviewContainer" class="mt-3 d-flex flex-wrap">
                {% for image in banner.images.all %}
                <div class="image-preview position-relative" id="image-{{ image.id }}">
                    <!-- Delete Button (Top Right Corner) -->
                    <button type="button" class="btn btn-danger btn-sm delete-image" data-image-id="{{ image.id }}">
                        ×
                    </button>

                    <img src="{{ image.images.url }}" class="preview-img">
                    <input type="text" class="form-control mt-1" name="captions[]" value="{{ image.caption }}"
                        placeholder="Caption">
                    <input type="text" class="form-control mt-1" name="links[]" value="{{ image.link }}"
                        placeholder="Link">
                </div>
                {% endfor %}
            </div>





            <div class="form-group mt-3">
                <label for="content" style="color: #000000; font-weight: 600;">Content <span
                        class="text-danger">*</span></label>
                <textarea class="form-control" id="content" name="content" rows="5"
                    required>{{ banner.content|striptags }}</textarea>
                <div class="invalid-feedback">Please enter content.</div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Update Banner</button>
                <a href="{% url 'enroll:banner_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>

    function previewNewImages(event) {
        const container = document.getElementById('newImagePreviewContainer');
        container.innerHTML = ''; // Purane previews remove kare bina existing images hataye

        const files = event.target.files;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'image-preview position-relative';
                    previewDiv.innerHTML = `<img src="${e.target.result}" style="width: 150px; height: 150px; object-fit: cover;">
                                            <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0" onclick="this.parentElement.remove()">✖</button>
                                            <input type="text" class="form-control mt-1" name="captions[]" placeholder="Caption">
                                            <input type="text" class="form-control mt-1" name="links[]" placeholder="Link">`;
                    container.appendChild(previewDiv);
                };
                reader.readAsDataURL(file);
            }
        }
    }

    function removeExistingImage(imageId, btn) {
        // Remove the image preview
        btn.parentElement.style.display = "none";
        // Create hidden input to mark this image for deletion
        let input = document.createElement("input");
        input.type = "hidden";
        input.name = "delete_images[]";
        input.value = imageId;
        document.forms[0].appendChild(input);
    }
    function previewImages(event) {
        const container = document.getElementById('imagePreviewContainer');
        container.innerHTML = '';

        const files = event.target.files;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const previewDiv = document.createElement('div');
                    previewDiv.className = 'image-preview';
                    previewDiv.innerHTML = `<img src="${e.target.result}" style="width: 150px; height: 150px; object-fit: cover;">
                                            <input type="text" class="form-control mt-1" name="captions[]" placeholder="Caption">
                                            <input type="text" class="form-control mt-1" name="links[]" placeholder="Link">`;
                    container.appendChild(previewDiv);
                };
                reader.readAsDataURL(file);
            }
        }
    }


    function removeImage(imageId, btn) {
        document.getElementById('delete-image-' + imageId).value = imageId; // Backend ko delete ID bhejo
        btn.closest('.image-preview').style.display = 'none'; // Image hide karo
    }


    function removeImage(imageId) {
        // Delete hone wali image ka ID set karo
        let deleteInput = document.createElement("input");
        deleteInput.type = "hidden";
        deleteInput.name = "delete_images[]";
        deleteInput.value = imageId;

        // Form me add karo
        document.querySelector("form").appendChild(deleteInput);

        // Image ko frontend se hide karo
        document.getElementById("image-container-" + imageId).style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
        let deletedImages = [];

        document.querySelectorAll(".delete-image").forEach(button => {
            button.addEventListener("click", function () {
                let imageId = this.getAttribute("data-image-id");
                if (imageId) {
                    deletedImages.push(imageId);
                    document.getElementById("deletedImages").value = deletedImages.join(",");

                    // Hide the deleted image preview
                    this.parentElement.remove();
                }
            });
        });
    });


    $(document).ready(function () {
        $(".delete-image").click(function () {
            let imageId = $(this).data("image-id");
            let imageDiv = $("#image-" + imageId);

            if (confirm("Are you sure you want to delete this image?")) {
                $.ajax({
                    url: "{% url 'enroll:delete_banner_image' %}",
                    type: "POST",
                    data: {
                        image_id: imageId,
                        csrfmiddlewaretoken: "{{ csrf_token }}"
                    },
                    success: function (response) {
                        if (response.status === "success") {
                            imageDiv.remove();  // Remove from UI
                        } else {
                            alert("Error deleting image.");
                        }
                    },
                    error: function () {
                        alert("Server error.");
                    }
                });
            }
        });
    });
</script>

<style>
    .image-preview {
        position: relative;
        display: inline-block;
        margin: 10px;
        text-align: center;
    }

    .preview-img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 5px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    .delete-image {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: red;
        color: white;
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
    }

    .delete-image:hover {
        background-color: darkred;
    }
</style>

</style>

{% endblock %}
