{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Vendor Registration | User Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Vendor Management System" name="description" />
    <meta content="Themesbrand" name="author" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'vendor/assets/images/favicon.ico' %}">

    <!-- Bootstrap Css -->
    <link href="{% static 'vendor/assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'vendor/assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'vendor/assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="account-pages my-5 pt-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card overflow-hidden">
                        <div class="bg-login text-center">
                            <div class="bg-login-overlay"></div>
                            <div class="position-relative">
                                <h5 class="text-white font-size-20">Vendor Registration</h5>
                                <p class="text-white-50 mb-0">Register your vendor account</p>
                                <a href="/" class="logo logo-admin mt-4">
                                    <img src="{% static 'vendor/assets/images/logo-sm-dark.png' %}" alt="" height="30">
                                </a>
                            </div>
                        </div>
                        <div class="card-body pt-5">
                            <div class="p-2">
                                {% if messages %}
                                <div class="messages">
                                    {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                                    {% endfor %}
                                </div>
                                {% endif %}

                                <form class="form-horizontal" action="{% url 'vendor:vendor_register' %}" method="POST">
                                    {% csrf_token %}
                                    
                                    <div class="form-group">
                                        <label for="full_name">Vendor Full Name</label>
                                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter vendor name" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="contact">Contact </label>
                                        <input type="text" class="form-control" id="contact" name="contact" placeholder="Enter contact number" required>
                                    </div>


                                    <div class="form-group">
                                        <label for="pass1">Password</label>
                                        <input type="password" class="form-control" id="pass1" name="pass1" placeholder="Enter password" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="pass2">Confirm Password</label>
                                        <input type="password" class="form-control" id="pass2" name="pass2" placeholder="Confirm password" required>
                                    </div>

                                    <div class="mt-4">
                                        <button class="btn btn-primary btn-block waves-effect waves-light" type="submit">Register</button>
                                    </div>

                                    <div class="mt-4 text-center">
                                        <p>Already registered? <a href="{% url 'vendor:vendor_login' %}" class="font-weight-medium text-primary">Login</a></p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <p>2025 Vendor Management. Crafted with <i class="mdi mdi-heart text-danger"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="{% static 'vendor/assets/libs/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
