{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Vendor Login | Vendor Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Vendor Management System" name="description" />
    <meta content="Themesbrand" name="author" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://kit-pro.fontawesome.com/releases/v5.13.1/css/pro.min.css" media="screen" />
    
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'vendor/assets/images/favicon.ico' %}">
    <!-- Bootstrap Css -->
    <link href="{% static 'vendor/assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'vendor/assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="{% static 'vendor/assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="account-pages my-5 pt-sm-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card overflow-hidden">
                        <div class="bg-login text-center">
                            <div class="bg-login-overlay"></div>
                            <div class="position-relative">
                                <h5 class="text-white font-size-20">Welcome Vendor!</h5>
                                <p class="text-white-50 mb-0">Sign in to access your dashboard.</p>
                                <a href="{% url 'vendor:vendor_dashboard' %}" class="logo logo-admin mt-4">
                                    <img src="{% static 'vendor/assets/images/logo-sm-dark.png' %}" alt="" height="30">
                                </a>
                            </div>
                        </div>
                        <div class="card-body pt-5">
                            <div class="p-2">
                                {% if messages %}
                                <div class="messages">
                                    {% for message in messages %}
                                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                                        {{ message }}
                                    </div>
                                    {% endfor %}
                                </div>
                                {% endif %}
                                
                                <form class="form-horizontal" method="POST" action="{% url 'vendor:vendor_login' %}">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="password">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                                    </div>

                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input" id="rememberMe">
                                        <label class="custom-control-label" for="rememberMe">Remember me</label>
                                    </div>

                                    <div class="mt-3">
                                        <button class="btn btn-primary btn-block waves-effect waves-light" type="submit">Log In</button>
                                    </div>

                                    <div class="mt-4 text-center">
                                        <a href="#" class="text-muted"><i class="mdi mdi-lock mr-1"></i> Forgot your password?</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <p>Don't have an account? <a href="{% url 'vendor:vendor_register' %}" class="font-weight-medium text-primary">Sign up now</a></p>
                        <p> 2025 Vendor Portal. Crafted with <i class="mdi mdi-heart text-danger"></i></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="{% static 'vendor/assets/libs/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/assets/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/assets/libs/metismenu/metisMenu.min.js' %}"></script>
    <script src="{% static 'vendor/assets/libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'vendor/assets/libs/node-waves/waves.min.js' %}"></script>
    <!-- App js -->
    <script src="{% static 'vendor/assets/js/app.js' %}"></script>
</body>
</html>
